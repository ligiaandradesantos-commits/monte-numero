<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monte o Número</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #eef4ff;
      text-align: center;
      margin: 0;
      padding: 20px;
      color: #222;
    }

    .caixa {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 24px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.12);
    }

    h1 {
      color: #173f7a;
      font-size: 34px;
      margin-bottom: 8px;
    }

    h2 {
      color: #3157a4;
    }

    .nome-area {
      margin: 20px 0;
    }

    input {
      width: 90%;
      max-width: 400px;
      padding: 14px;
      border: 2px solid #3157a4;
      border-radius: 12px;
      font-size: 20px;
      text-align: center;
    }

    button {
      font-family: Arial, sans-serif;
      cursor: pointer;
    }

    .botao-principal {
      background: #173f7a;
      color: white;
      border: none;
      border-radius: 14px;
      padding: 15px 28px;
      font-size: 20px;
      font-weight: bold;
      margin: 10px;
    }

    .nivel {
      background: #3157a4;
      color: white;
      border: none;
      border-radius: 14px;
      padding: 14px 22px;
      font-size: 19px;
      font-weight: bold;
      margin: 7px;
    }

    .nivel:hover,
    .botao-principal:hover {
      opacity: 0.9;
    }

    #jogo {
      display: none;
    }

    #nivelAtual {
      font-size: 21px;
      font-weight: bold;
      color: #173f7a;
      margin-bottom: 12px;
    }

    #contador {
      font-size: 18px;
      margin: 10px;
    }

    #numeroPorExtenso {
      font-size: 38px;
      font-weight: bold;
      color: #173f7a;
      margin: 30px 10px;
      text-transform: uppercase;
    }

    #numeroMontado {
      min-height: 65px;
      border: 3px dashed #3157a4;
      border-radius: 16px;
      margin: 20px auto;
      max-width: 500px;
      padding: 12px;
      font-size: 42px;
      font-weight: bold;
      color: #173f7a;
      background: #f7faff;
      letter-spacing: 8px;
    }

    .algarismos {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      max-width: 500px;
      margin: 20px auto;
    }

    .algarismo {
      background: #173f7a;
      color: white;
      border: none;
      border-radius: 14px;
      padding: 17px 10px;
      font-size: 30px;
      font-weight: bold;
      min-height: 65px;
    }

    .algarismo:hover {
      background: #0f2e5c;
    }

    .acoes {
      margin-top: 20px;
    }

    .acao {
      border: none;
      border-radius: 12px;
      padding: 13px 22px;
      font-size: 19px;
      font-weight: bold;
      margin: 5px;
    }

    #limpar {
      background: #d9e5f7;
      color: #173f7a;
    }

    #conferir {
      background: #173f7a;
      color: white;
    }

    #proximo {
      display: none;
      background: #3157a4;
      color: white;
    }

    #encerrar {
      background: #7a2531;
      color: white;
    }

    #mensagem {
      min-height: 45px;
      font-size: 23px;
      font-weight: bold;
      margin: 20px 10px;
    }

    #composicao {
      font-size: 20px;
      line-height: 1.6;
      margin: 15px;
    }

    #resultado {
      display: none;
      margin-top: 25px;
      font-size: 23px;
      line-height: 1.7;
    }

    #jogarNovamente {
      display: none;
      background: #173f7a;
      color: white;
      border: none;
      border-radius: 14px;
      padding: 15px 25px;
      font-size: 20px;
      font-weight: bold;
    }

    footer {
      margin-top: 30px;
      font-size: 14px;
      color: #666;
    }

    @media (max-width: 500px) {
      h1 {
        font-size: 28px;
      }

      #numeroPorExtenso {
        font-size: 30px;
      }

      #numeroMontado {
        font-size: 34px;
      }

      .algarismos {
        grid-template-columns: repeat(5, 1fr);
        gap: 7px;
      }

      .algarismo {
        font-size: 25px;
        padding: 13px 5px;
      }
    }
  </style>
</head>

<body>

<div class="caixa">

  <h1>🔢 MONTE O NÚMERO</h1>

  <div id="inicio">

    <h2>Vamos aprender a montar números!</h2>

    <div class="nome-area">
      <input
        type="text"
        id="nome"
        placeholder="Digite o nome da criança"
      >
    </div>

    <p><strong>Escolha um nível:</strong></p>

    <button class="nivel" onclick="iniciarJogo(1)">
      NÍVEL 1 — DEZENAS
    </button>

    <button class="nivel" onclick="iniciarJogo(2)">
      NÍVEL 2 — CENTENAS
    </button>

    <button class="nivel" onclick="iniciarJogo(3)">
      NÍVEL 3 — MILHARES
    </button>

  </div>


  <div id="jogo">

    <div id="nivelAtual"></div>

    <div id="contador"></div>

    <div id="numeroPorExtenso"></div>

    <div>
      <strong>MONTE O NÚMERO:</strong>
    </div>

    <div id="numeroMontado"></div>

    <div class="algarismos">

      <button class="algarismo" onclick="adicionarAlgarismo('0')">0</button>
      <button class="algarismo" onclick="adicionarAlgarismo('1')">1</button>
      <button class="algarismo" onclick="adicionarAlgarismo('2')">2</button>
      <button class="algarismo" onclick="adicionarAlgarismo('3')">3</button>
      <button class="algarismo" onclick="adicionarAlgarismo('4')">4</button>

      <button class="algarismo" onclick="adicionarAlgarismo('5')">5</button>
      <button class="algarismo" onclick="adicionarAlgarismo('6')">6</button>
      <button class="algarismo" onclick="adicionarAlgarismo('7')">7</button>
      <button class="algarismo" onclick="adicionarAlgarismo('8')">8</button>
      <button class="algarismo" onclick="adicionarAlgarismo('9')">9</button>

    </div>

    <div class="acoes">

      <button class="acao" id="limpar" onclick="limparNumero()">
        🧹 LIMPAR
      </button>

      <button class="acao" id="conferir" onclick="conferirNumero()">
        ✅ CONFERIR
      </button>

      <button class="acao" id="proximo" onclick="proximaPergunta()">
        ➜ PRÓXIMO
      </button>

      <button class="acao" id="encerrar" onclick="encerrarJogo()">
        ⏹️ ENCERRAR JOGO
      </button>

    </div>

    <div id="mensagem"></div>

    <div id="composicao"></div>

  </div>


  <div id="resultado"></div>

  <button id="jogarNovamente" onclick="voltarInicio()">
    🔄 JOGAR NOVAMENTE
  </button>


  <footer>
    © 2026 Professora Lígia Andrade — Todos os direitos reservados.
  </footer>

</div>

};


let nivel = 1;
let numeroAtual = 0;
let numeroMontado = "";
let tentativas = 0;
let acertos = 0;
let encerrado = false;


function gerarNumero() {

  let numero;

  if (nivel === 1) {

    numero = Math.floor(Math.random() * 90) + 10;

  } else if (nivel === 2) {

    const numeros = [
      100,101,102,110,111,112,
      120,121,122,150,152,
      200,210,215,222,
      300,321,
      400,432,
      500,555,
      600,654,
      700,765,
      800,876,
      900,999
    ];

    numero = numeros[Math.floor(Math.random() * numeros.length)];

  } else {

    const numeros = [
      1000,1001,1010,1011,1020,1052,
      1100,1111,1200,1234,
      1500,1523,2000,2022,2345,
      3000,3456,4000,4321,
      5000,5678,6000,6543,
      7000,7654,8000,8765,
      9000,9999
    ];

    numero = numeros[Math.floor(Math.random() * numeros.length)];

  }

  return numero;
}


function iniciarJogo(n) {

  nivel = n;
  tentativas = 0;
  acertos = 0;
  encerrado = false;

  document.getElementById("inicio").style.display = "none";
  document.getElementById("resultado").style.display = "none";
  document.getElementById("jogarNovamente").style.display = "none";
  document.getElementById("jogo").style.display = "block";

  if (nivel === 1) {
    document.getElementById("nivelAtual").innerText =
      "NÍVEL 1 — DEZENAS (10 A 99)";
  }

  if (nivel === 2) {
    document.getElementById("nivelAtual").innerText =
      "NÍVEL 2 — CENTENAS (100 A 999)";
  }

  if (nivel === 3) {
    document.getElementById("nivelAtual").innerText =
      "NÍVEL 3 — MILHARES";
  }

  novaPergunta();
}


function novaPergunta() {

  numeroAtual = gerarNumero();

  numeroMontado = "";

  document.getElementById("numeroPorExtenso").innerText =
    numerosPorExtenso[numeroAtual].toUpperCase();

  document.getElementById("numeroMontado").innerText = "";

  document.getElementById("mensagem").innerText = "";

  document.getElementById("composicao").innerText = "";

  document.getElementById("proximo").style.display = "none";

  document.getElementById("limpar").style.display = "inline-block";

  document.getElementById("conferir").style.display = "inline-block";

  atualizarContador();
}


function adicionarAlgarismo(algarismo) {

  if (encerrado) {
    return;
  }

  // IMPORTANTE:
  // O mesmo algarismo pode ser clicado quantas vezes forem necessárias.
  // Não existe limite de repetição.

  numeroMontado += algarismo;

  document.getElementById("numeroMontado").innerText =
    numeroMontado;
}


function limparNumero() {

  if (encerrado) {
    return;
  }

  numeroMontado = "";

  document.getElementById("numeroMontado").innerText = "";

  document.getElementById("mensagem").innerText = "";

  document.getElementById("composicao").innerText = "";
}


function conferirNumero() {

  if (encerrado) {
    return;
  }

  if (numeroMontado === "") {

    document.getElementById("mensagem").innerText =
      "💡 MONTE O NÚMERO PRIMEIRO!";

    return;
  }

  tentativas++;

  if (numeroMontado === String(numeroAtual)) {

    acertos++;

    document.getElementById("mensagem").innerText =
      "🎉 MUITO BEM! VOCÊ ACERTOU!";

    mostrarComposicao(numeroAtual);

    document.getElementById("conferir").style.display = "none";

    document.getElementById("limpar").style.display = "none";

    document.getElementById("proximo").style.display = "inline-block";

  } else {

    document.getElementById("mensagem").innerText =
      "💭 AINDA NÃO. TENTE NOVAMENTE!";

    document.getElementById("composicao").innerText =
      "DICA: OBSERVE QUANTOS ALGARISMOS O NÚMERO PRECISA TER.";

  }

  atualizarContador();
}


function mostrarComposicao(numero) {

  const texto = String(numero);

  const tamanho = texto.length;

  let partes = [];

  if (tamanho >= 4) {

    const milhares = Number(texto[0]);

    if (milhares > 0) {
      partes.push(
        milhares + (milhares === 1 ? " MILHAR" : " MILHARES")
      );
    }

  }

  if (tamanho >= 3) {

    const centenas = Number(texto[tamanho - 3]);

    if (centenas > 0) {
      partes.push(
        centenas + (centenas === 1 ? " CENTENA" : " CENTENAS")
      );
    }

  }

  if (tamanho >= 2) {

    const dezenas = Number(texto[tamanho - 2]);

    if (dezenas > 0) {
      partes.push(
        dezenas + (dezenas === 1 ? " DEZENA" : " DEZENAS")
      );
    }

  }

  const unidades = Number(texto[tamanho - 1]);

  if (unidades > 0) {

    partes.push(
      unidades + (unidades === 1 ? " UNIDADE" : " UNIDADES")
    );

  }

  document.getElementById("composicao").innerHTML =
    "🔎 COMPOSIÇÃO:<br>" +
    partes.join(" + ") +
    "<br><strong>" +
    numero +
    "</strong>";

}


function proximaPergunta() {

  if (encerrado) {
    return;
  }

  novaPergunta();
}


function atualizarContador() {

  document.getElementById("contador").innerText =
    "🎯 TENTATIVAS: " + tentativas +
    "     ⭐ ACERTOS: " + acertos;

}


function encerrarJogo() {

  encerrado = true;

  const nome =
    document.getElementById("nome").value.trim() || "A criança";

  document.getElementById("jogo").style.display = "none";

  document.getElementById("resultado").style.display = "block";

  document.getElementById("resultado").innerHTML =
    "⏹️ <strong>JOGO ENCERRADO!</strong><br><br>" +
    "Muito bem, " + nome + "!<br><br>" +
    "🎯 TENTATIVAS: " + tentativas + "<br>" +
    "⭐ ACERTOS: " + acertos + "<br><br>" +
    "Continue praticando! 🌟";

  document.getElementById("jogarNovamente").style.display =
    "inline-block";
}


function voltarInicio() {

  encerrado = false;

  document.getElementById("jogo").style.display = "none";

  document.getElementById("resultado").style.display = "none";

  document.getElementById("jogarNovamente").style.display = "none";

  document.getElementById("inicio").style.display = "block";

}


</script>

</body>
</html>
